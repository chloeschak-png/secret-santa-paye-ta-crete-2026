<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vote envoyé ! Secret Santa Soirée</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,700..900,0..100,0..1&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#F1E8D6;--surface:#FBF6EC;--ink:#3F4723;--muted:#7A7357;--line:#E2D5BC;--fir:#5B6A2C;--berry:#D2463A;--gold:#C8922B;--soft:#F2D9C4;--display:"Fraunces",Georgia,serif;--body:"DM Sans",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.card{max-width:460px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:36px 24px;display:grid;gap:16px;justify-items:center;text-align:center}
svg{width:72px;height:72px;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){svg{animation:none}}
h1{margin:0;font-family:var(--display);font-weight:900;font-variation-settings:"SOFT" 100,"WONK" 1;text-transform:uppercase;font-size:clamp(2.4rem,12vw,3.4rem);line-height:.95;color:var(--berry)}
p{margin:0;color:var(--muted)}
.big{font-size:1.1rem;color:var(--ink);font-weight:500}
.bisous{font-family:var(--display);font-weight:900;font-variation-settings:"SOFT" 100,"WONK" 1;font-size:1.3rem;color:var(--berry);background:var(--soft);border:1.5px dashed var(--gold);border-radius:14px;padding:12px 26px;transform:rotate(-2deg)}
a{font-weight:700;color:var(--fir)}
</style>
</head>
<body>
<main class="card">
  <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="14" width="30" height="22" rx="2" fill="#E8877A"/><rect x="18" y="14" width="5" height="22" fill="#C8922B"/><path d="M20.5 14c-3-7-11-6-8 0M20.5 14c3-7 11-6 8 0" fill="none" stroke="#C8922B" stroke-width="3" stroke-linecap="round"/></svg>
  <h1 id="h">Vote envoyé&nbsp;!</h1>
  <p class="big" id="big">Le sort du menu est entre vos mains. Ton update et tes votes sont bien arrivés chez l'organisatrice.</p>
  <p id="rdv">On se voit le 22 décembre à 19h chez Céleste, 4 rue de Panama, 75018 Paris.</p>
  <p class="bisous">Bisous les jeunes</p>
  <a href="./">Revenir au site</a>
</main>
<script>
try{localStorage.removeItem("secret-santa-brouillon");localStorage.setItem("secret-santa-envoye",new Date().toISOString())}catch(e){}
if(new URLSearchParams(location.search).get("absent")){
  document.getElementById("h").textContent="Update envoyé\u00a0!";
  document.getElementById("big").textContent="Ton update est bien arrivé chez l'organisatrice.";
  document.getElementById("rdv").textContent="Dommage que tu ne sois pas là le 22, on pensera à toi pendant le diaporama\u00a0!";
}
</script>
</body>
</html>
